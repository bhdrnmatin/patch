name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Clone repository
        run: |
          rm -rf app-client
          git clone --depth 1 --branch main https://git.patchapp.ir/patch/frontend.git app-client

      - name: Build Docker image
        run: docker build --no-cache -t frontend:latest ./app-client

      - name: Deploy
        run: docker compose -f ~/apps/docker-compose.yml up -d --no-deps --force-recreate frontend