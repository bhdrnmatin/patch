stages:
  - build
  - deploy

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - docker build --no-cache -t frontend:latest .

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GIT_STRATEGY: none
  script:
    - docker compose -f /apps/docker-compose.yml up -d --no-deps --force-recreate frontend