build_test:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
  script:
    - docker build --no-cache -t frontend:ci-validation-test .
    - docker image rm frontend:ci-validation-test
    - echo "build-only validation OK, no deploy performed"
